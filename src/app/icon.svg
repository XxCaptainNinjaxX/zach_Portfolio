<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    The flourish motif inside a gold ring.

    This is a hand-drawn second copy of src/components/ui/Flourish.tsx: same
    two-lobe strand shape, three strands instead of nine, horizontal spread
    exaggerated so it still reads at 16px. Nothing is shared between the two
    files — a change to the component does not reach this one.

    Colours are hardcoded because a favicon has no access to the theme tokens,
    and it only ever appears on the dark navy tile.
  -->
  <defs>
    <linearGradient id="mark-gold-ramp" gradientUnits="userSpaceOnUse" x1="10" y1="8" x2="54" y2="56">
      <stop offset="0%" stop-color="#8A6F1E"/>
      <stop offset="30%" stop-color="#C9A227"/>
      <stop offset="52%" stop-color="#E0BD44"/>
      <stop offset="74%" stop-color="#C9A227"/>
      <stop offset="100%" stop-color="#8A6F1E"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="12" fill="#0B1A3A"/>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#C9A227" stroke-width="2"/>

  <g fill="none" stroke="url(#mark-gold-ramp)" stroke-linecap="round">
    <path d="M32 14 C 27.5 19.3, 15 26.7, 32 30.6 C 49 36.4, 36.5 44, 32 50" stroke-width="1.4" opacity="0.45"/>
    <path d="M32 14 C 29.21 19.3, 21.46 26.7, 32 31.6 C 42.54 36.4, 34.79 44, 32 50" stroke-width="2.6"/>
    <path d="M32 14 C 30.65 19.3, 26.9 26.7, 32 32.6 C 37.1 36.4, 33.35 44, 32 50" stroke-width="1.8" opacity="0.6"/>
    <!-- Spine overshoots the strand tips, so the mark tapers instead of stopping. -->
    <path d="M32 10 L32 54" stroke-width="0.6" opacity="0.3"/>
  </g>
</svg>
